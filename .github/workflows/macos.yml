name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Compile
        run: swiftc AudioInputMonitor.swift main.swift -o mic-monitor

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mic-monitor-macos
          path: mic-monitor
